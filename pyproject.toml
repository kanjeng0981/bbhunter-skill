[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bbhunter"
version = "0.1.0"
description = "AI-powered bug bounty hunter agent (web2 + web3)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
bbhunter = "bbhunter.cli:main"

[tool.setuptools.packages.find]
include = ["bbhunter*"]
